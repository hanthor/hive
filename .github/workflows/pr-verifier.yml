name: PR Verifier

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  checks: write
  pull-requests: read
  packages: read

jobs:
  verify:
    name: verify PR contents
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    env:
      PR_VERIFIER_IMAGE: ghcr.io/kubestellar/pr-verifier@sha256:8c2b63817c4bfa7de510ab699b154637f27a42f87826c98083903daf2a539943
    steps:
      # The verifier image lives in another org's registry. This fork's
      # GITHUB_TOKEN cannot always read it, so neither the login nor the pull
      # may fail the check: the verification itself is advisory (the verifier
      # step below is continue-on-error), so an unreachable image must not be
      # reported as a PR defect.
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        continue-on-error: true
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull verifier image
        id: pull
        continue-on-error: true
        run: docker pull "$PR_VERIFIER_IMAGE"
      - name: Verifier action
        id: verifier
        if: steps.pull.outcome == 'success'
        continue-on-error: true
        run: |
          docker run --rm \
            -e INPUT_GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
            -e GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
            -e GITHUB_ACTIONS="true" \
            -e GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" \
            -e GITHUB_EVENT_PATH="/github/event.json" \
            -e GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
            -e GITHUB_SHA="$GITHUB_SHA" \
            -e GITHUB_REF="$GITHUB_REF" \
            -e GITHUB_WORKSPACE="/github/workspace" \
            -v "$GITHUB_EVENT_PATH:/github/event.json:ro" \
            -v "$GITHUB_WORKSPACE:/github/workspace:ro" \
            "$PR_VERIFIER_IMAGE"
